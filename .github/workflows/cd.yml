name: CD

# CD chỉ khi push git tag `v*` (mỗi tag = 1 version) — commit lẻ lên master
# chỉ chạy CI. workflow_dispatch: CD tùy ý từ UI, version tag = tên run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/img2text-server:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/img2text-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/img2text-web:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/img2text-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

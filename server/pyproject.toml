[project]
name = "img2text-server"
version = "0.1.0"
description = "img2text server: FastAPI + SQLAlchemy async + asyncpg"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic-settings",
    "alembic",
    "bcrypt>=4",
    "PyJWT",
    "apscheduler",
    "boto3",
    "pypdf",
    "pillow",
    "python-multipart",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "moto[server]",
    "pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

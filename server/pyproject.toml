[project]
name = "img2text-server"
version = "0.1.0"
description = "img2text server: FastAPI + SQLAlchemy async + asyncpg"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    # llm_docx import lúc boot — phải là main dep (không nằm test group)
    "httpx",
    # [standard] = watchfiles (reload bằng inotify, không poll), uvloop,
    # httptools — CPU thấp hơn hẳn StatReload poll cả cây source.
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic-settings",
    "alembic",
    "bcrypt>=4",
    "PyJWT",
    "apscheduler",
    "boto3",
    "pypdf",
    "pymupdf",
    "pillow",
    # HEIC/HEIF decode (Pillow 12.3 native AVIF — không cần dep cho avif)
    "pillow-heif",
    "python-multipart",
    "python-docx",
    # công thức → OMML (Word render thật, không phải ảnh)
    "latex2mathml",
    "mathml2omml",
    "bleach",
    "weasyprint",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "moto[server]",
]
# Plan K2: Kaggle worker orchestration — server imports kaggle LAZILY and
# self-disables without it; install this extra to activate auto-spawn.
kaggle = [
    "kaggle>=1.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[pytest]
asyncio_mode = auto
# Session-scoped loops: module-level engine pool holds asyncpg connections
# bound to one loop; per-test loops break with "attached to a different loop".
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
testpaths = tests
filterwarnings =
    # weasyprint 70 emits this on import; no harfbuzz-subset in deploy image
    ignore:HarfBuzz-Subset will be required by future versions of WeasyPrint:DeprecationWarning

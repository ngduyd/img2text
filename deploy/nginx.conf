# img2text edge (Plan G Task 1): SPA static + /api/ reverse proxy.
server {
    listen 80;
    client_max_body_size 60m;  # 50 MB uploads + multipart overhead

    # P0 spec 2026-10-15: security headers.
    # TLS terminates UPSTREAM (certbot / external reverse proxy) — this edge
    # listens plain HTTP behind it.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://server:8000/healthz;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

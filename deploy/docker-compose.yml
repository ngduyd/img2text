# img2text prod stack (Plan G Task 1). web/dist is built on the host first:
#   cd web && npm run build && docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: img2text
      POSTGRES_PASSWORD: img2text
      POSTGRES_DB: img2text
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U img2text -d img2text"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://img2text:img2text@postgres:5432/img2text
    depends_on:
      postgres:
        condition: service_healthy
    # Single uvicorn worker by design — in-process rate limits assume it.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  pgdata:

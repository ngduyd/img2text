# img2text prod stack (Plan G Task 1). web/dist is built on the host first:
#   cd web && npm run build && docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: img2text
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-img2text}
      POSTGRES_DB: img2text
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U img2text -d img2text"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://img2text:${POSTGRES_PASSWORD:-img2text}@postgres:5432/img2text
    depends_on:
      postgres:
        condition: service_healthy
    # P0 spec 2026-10-15: health probe. python:3.11-slim has no curl/wget —
    # urllib raises on non-200 (503 from /healthz) → exit 1.
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Single uvicorn worker by design — in-process rate limits assume it.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    # busybox wget in nginx:alpine (P0 spec 2026-10-15)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  pgdata:

# img2text prod stack — PREBUILT IMAGES (không build trên host).
#   cp deploy/.env.example deploy/.env   # điền secrets, ENV=prod
#   docker compose -f deploy/docker-compose.images.yml up -d
# UI: image web tĩnh (SPA nginx) + mount deploy/nginx.conf edge
#     (SPA fallback + /api proxy → server:8000 + /healthz + security headers).
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: img2text
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set trong .env}
      POSTGRES_DB: img2text
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U img2text -d img2text"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    image: docker.io/ngduyd/img2text-server:v0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://img2text:${POSTGRES_PASSWORD:?}@postgres:5432/img2text
    depends_on:
      postgres:
        condition: service_healthy
    # python:3.11-slim không có curl — urllib /healthz
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 1 uvicorn worker — in-process rate limit giả định thế
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    image: docker.io/ngduyd/img2text-web:v0.1.0
    restart: unless-stopped
    ports:
      - "18080:80"   # 80 đã có portfolio trên host
    volumes:
      # Edge config: SPA + /api + /healthz proxy → server:8000 (thay nginx.conf tĩnh trong image)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

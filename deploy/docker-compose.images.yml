# img2text prod stack — PREBUILT IMAGES (không build trên host).
#
#   cp deploy/.env.example deploy/.env      # điền secrets, ENV=prod
#   docker compose -f deploy/docker-compose.images.yml up -d
#
# Vì sao có file này: `deploy/docker-compose.yml` build từ source (cần Node/Python
# toolchain trên host). File này chỉ kéo image đã CI build sẵn (tag = git tag),
# nên host chỉ cần Docker.
#
# UI: image web tĩnh (SPA nginx) + mount source `deploy/nginx.conf` làm edge
#     (SPA fallback + /api proxy → server:8000 + /healthz + security headers).
#     Mount conf thay vì tin conf trong image để sửa edge không cần build lại.
#
# Nâng version: đổi IMG_TAG trong .env (`IMG_TAG=v0.3.0`) hoặc `... up -d` sau khi
# đổi ở đây — cả 2 image dùng CÙNG tag để không lệch schema/contract.

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: img2text
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set trong deploy/.env}
      POSTGRES_DB: img2text
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U img2text -d img2text"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    image: docker.io/ngduyd/img2text-server:${IMG_TAG:-v0.3.0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://img2text:${POSTGRES_PASSWORD:?}@postgres:5432/img2text
    depends_on:
      postgres:
        condition: service_healthy
    # python:3.11-slim không có curl — urllib /healthz
    healthcheck:
      test:
        - CMD-SHELL
        # podman-compose ghép mảng thành 1 chuỗi cho /bin/sh: dạng ["CMD","python","-c","..."]
        # bị bóc nháy → sh thấy urlopen(... "(" không nháy → Syntax error. CMD-SHELL nhận
        # nguyên văn cả chuỗi nên nháy đơn bảo vệ được dấu ngoặc.
        - >-
          python -c 'import urllib.request as u; u.urlopen("http://127.0.0.1:8000/healthz", timeout=3)'
      interval: 30s
      timeout: 5s
      retries: 5
      # 15s là quá ngắn: lần boot đầu còn create_all + apply_migrations, chưa
      # kể pull image chậm → container bị đánh unhealthy dù đang khởi động đúng.
      start_period: 60s
    # 1 uvicorn worker — in-process rate limit giả định thế
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    image: docker.io/ngduyd/img2text-web:${IMG_TAG:-v0.3.0}
    restart: unless-stopped
    ports:
      # WEB_PORT trong .env: host đã dùng 80 (portfolio…) thì đặt 18080.
      - "${WEB_PORT:-80}:80"
    volumes:
      # Edge config: SPA + /api + /healthz proxy → server:8000 (thay nginx.conf
      # tĩnh trong image). Đường dẫn tương đối theo thư mục file compose = deploy/.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 chứ không "localhost": busybox wget resolve localhost → ::1
      # trước, mà nginx `listen 80` chỉ mở IPv4 → healthcheck fail vĩnh viễn.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      # /healthz là proxy sang server:8000 → phải chờ server+DB sẵn sàng
      start_period: 60s

volumes:
  pgdata:

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: img2text
      POSTGRES_PASSWORD: img2text
      POSTGRES_DB: img2text_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U img2text -d img2text_test"]
      interval: 2s
      timeout: 3s
      retries: 15

[project]
name = "img2text-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pillow",
    "rapidfuzz",
    "httpx",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
